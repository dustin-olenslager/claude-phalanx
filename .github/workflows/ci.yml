name: ci
# Exercises the project's OWN embedded self-test (the ~40 assertions inside
# install.sh), static checks, and the two plan-contract gates this repo ships to
# every other project (`sync-agents.sh --check` + `check-docs.sh` — job
# `contract`). install.sh is run against a throwaway
# CLAUDE_DIR; PHALANX_NO_CRON=1 + PHALANX_NO_GUARDS=1 keep CI from mutating the
# runner's crontab or global git config (install-guards.sh sets
# `git config --global core.hooksPath`).
#
# Report-only: this repo has no branch protection, so a red job does not block a
# merge. See AGENTS.md -> "Enforcement — the honest version".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install.sh self-test (isolated CLAUDE_DIR, no cron, no global git hooks)
        run: |
          set -euo pipefail
          CLAUDE_DIR="$(mktemp -d)"
          echo "CLAUDE_DIR=$CLAUDE_DIR"
          CLAUDE_DIR="$CLAUDE_DIR" \
          PHALANX_NO_CRON=1 \
          PHALANX_NO_GUARDS=1 \
            bash ./install.sh

  static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check gates
        run: |
          set -euo pipefail
          find hooks -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: bash -n (syntax fallback)
        run: |
          set -euo pipefail
          find scripts hooks -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: shellcheck (ubuntu)
        if: runner.os == 'Linux'
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "install.sh uninstall.sh"
          severity: warning   # match the macos job (-S warning); SC2015/SC2086-style notes are intentional
      - name: shellcheck (macos / BSD env)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install shellcheck
          find scripts hooks -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning install.sh uninstall.sh

  # The two plan-contract gates every sibling repo runs from scripts/templates/ci-verify.yml.
  # Wiring them here is what makes AGENTS.md's claim true for the repo that SHIPS the kit: a
  # commit that changes code without its worklog line, or a stale tool mirror, now fails CI on
  # the PR instead of depending on whoever happens to remember to run the script by hand.
  #
  # `check-expert-review.sh` is deliberately NOT wired. It wants a checklist.md with pending
  # items under docs/claude/, a new ADR under docs/adr/, and >=2 persona sign-offs in the PR
  # body for every non-trivial commit — a far heavier gate than this repo has ever run, and
  # turning it on is an operator decision, not a drive-by in a CI PR.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the docs gate can diff against the PR base
      - name: Agent mirrors in sync
        run: sh scripts/sync-agents.sh --check
      - name: Docs in sync
        run: sh scripts/check-docs.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'
